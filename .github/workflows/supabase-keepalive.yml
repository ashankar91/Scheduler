name: Supabase keep-alive ping

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/ping
        run: |
          status=$(curl -sS -o /tmp/response.json -w '%{http_code}' https://ananthschedule.vercel.app/api/ping)
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ne 200 ]; then
            echo "Ping failed"
            exit 1
          fi
